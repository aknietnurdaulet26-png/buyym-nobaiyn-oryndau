<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123f38"><meta name="description" content="Бұйымның нобайын орындау — Гүлмира мұғалімнің интерактивті сабағы. Қазақша және орысша викторина."><title>Бұйымның нобайын орындау · Нобай LAB</title><link rel="stylesheet" href="style.css?v=2"><script defer src="vendor/peerjs.min.js"></script><script defer src="vendor/qrcode.js"></script><script defer src="config.js?v=3"></script><script defer src="questions.js"></script><script defer src="questions-ru.js?v=2"></script><script defer src="core.js?v=2"></script><script defer src="i18n.js?v=2"></script><script defer src="transport.js?v=3"></script><script defer src="main.js?v=3"></script></head><body>
<header><a class="brand" href="./">✳ <span>НОБАЙ <b>LAB</b></span></a><span class="header-subject" data-i18n="subject"></span><nav class="language" aria-label="Language"><button data-lang="kk" lang="kk" aria-pressed="true">🇰🇿 Қазақша</button><button data-lang="ru" lang="ru" aria-pressed="false">🇷🇺 Русский</button></nav></header>
<main><div class="connection"><span class="dot"></span><span id="network" role="status"></span><span id="transportName"></span></div>
<section id="home"><div class="hero"><div class="hero-copy"><span class="eyebrow" data-i18n="eyebrow"></span><h1 data-i18n="title"></h1><div class="teacher"><span class="avatar">Г</span><span data-i18n="teacher"></span><span class="teacher-line"></span></div><p class="hero-lead" data-i18n="intro"></p><div class="steps"><span><b>01</b><i>✧</i><small data-i18n="idea"></small></span><span><b>02</b><i>△</i><small data-i18n="shape"></small></span><span><b>03</b><i>✎</i><small data-i18n="detail"></small></span><span><b>04</b><i>✓</i><small data-i18n="result"></small></span></div></div><div class="workshop" aria-hidden="true"><div class="paper"><span class="eyebrow" data-i18n="sketch"></span><svg viewBox="0 0 360 300"><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dae3d9" stroke-width=".6"/></pattern></defs><rect width="360" height="300" fill="url(#grid)"/><g fill="none" stroke="#205749" stroke-width="2"><path d="M91 101L244 82L278 211L111 235Z"/><path d="M91 101L118 83L268 65L244 82M268 65L302 191L278 211M111 235L137 215"/><path d="M132 95Q120 18 172 28Q215 23 212 86M148 92Q136 40 173 43Q198 38 196 88"/><path d="M157 154C120 117 113 174 153 173C185 171 168 207 145 186M207 146C234 110 253 159 217 164C185 169 207 201 227 177"/><path stroke-dasharray="5 5" stroke-width="1" d="M183 79L204 224M80 259L281 235M310 68L340 191"/></g><g fill="#205749" font-family="monospace" font-size="12"><text x="149" y="266">30 см</text><text x="306" y="130" transform="rotate(76 306 130)">25 см</text><text x="17" y="37" data-i18n="material">мата + ою</text></g></svg><span data-i18n="sketchNote" class="paper-caption"></span></div><div class="pencil"></div><div class="ruler"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span></div><svg class="compass" viewBox="0 0 90 160"><g stroke="#265b52" stroke-width="7" fill="none" stroke-linecap="round"><path d="M45 32L12 145M45 32L78 145M45 12V32"/><circle cx="45" cy="39" r="11" fill="#f0c275"/></g><path d="M20 113Q45 128 70 113" stroke="#265b52" stroke-width="2" fill="none"/></svg><span class="workshop-label" data-i18n="hero"></span></div></div>
<div class="entry-grid"><section class="card entry"><div class="card-tag"><span>01</span><b data-i18n="student"></b></div><h2 data-i18n="joinTitle"></h2><form id="joinForm"><div class="form-grid"><div><label for="name" data-i18n="nameLabel"></label><input id="name" required maxlength="32" autocomplete="given-name" data-placeholder="namePlaceholder"></div><div><label for="code" data-i18n="codeLabel"></label><input id="code" required pattern="[0-9]{6}" inputmode="numeric" maxlength="6" data-placeholder="codePlaceholder"></div></div><button type="submit" class="wide"><span data-i18n="join"></span><span>↗</span></button><button id="resumeStudent" type="button" class="secondary wide" hidden data-i18n="restoreStudent"></button></form></section><section class="card teacher-entry"><div class="card-tag"><span>02</span><b data-i18n="host"></b></div><h2 data-i18n="hostTitle"></h2><p data-i18n="hostIntro"></p><div class="actions"><button id="create" data-i18n="create"></button><button id="restore" hidden class="secondary" data-i18n="restore"></button></div><p class="small" data-i18n="hostHint"></p></section></div><p class="footnote" data-i18n="rule"></p></section>
<section id="game" hidden><div class="game-head"><div><span class="eyebrow" data-i18n="title"></span><h1 id="gameTitle"></h1><p class="teacher-mini" data-i18n="teacher"></p></div><div class="room-badge"><span data-i18n="codeLabel"></span><strong id="roomCode"></strong></div></div>
<section id="hostControls" hidden><div class="host-layout"><aside class="card invite-card"><span class="eyebrow" data-i18n="qrTitle"></span><button id="qrButton" class="qr-button" aria-label="QR"><div id="qr"></div><span data-i18n="enlarge"></span></button><p class="small" data-i18n="qrHint"></p><label for="inviteLink" data-i18n="invite"></label><input id="inviteLink" readonly><button id="copy" class="secondary wide" data-i18n="copy"></button></aside><div class="card dashboard"><div class="flex"><div><span class="eyebrow" data-i18n="participants"></span><h2 id="count">0 / 30</h2></div><button id="fullscreen" class="secondary" data-i18n="fullscreen"></button></div><p id="onlineCount"></p><div id="setup" class="form-grid"><div><label for="mode" data-i18n="mode"></label><select id="mode"><option value="rounds" data-i18n="roundMode"></option><option value="self" data-i18n="selfMode"></option></select></div><div><label for="duration" data-i18n="duration"></label><select id="duration"><option value="30">30 s</option><option value="45" selected>45 s</option><option value="60">60 s</option><option value="90">90 s</option></select></div></div><div class="actions host-actions"><button id="next"></button><button id="closeRound" class="secondary" hidden></button><button id="csv" class="secondary" data-i18n="csv"></button><button id="newRoom" class="secondary" data-i18n="newRoom"></button></div><p class="small" data-i18n="hostHint"></p><p class="small" data-i18n="connectionNote"></p></div></div></section>
<div class="play-grid"><section class="card question-card"><div class="flex"><span id="stage" class="eyebrow"></span><span id="timer" class="timer"></span></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="15" aria-valuenow="0" aria-label="Progress"><div id="bar"></div></div><h2 id="question"></h2><div id="answers"></div><p id="feedback" role="status"></p><div id="answerHistory"></div></section><aside class="card leaderboard"><span class="eyebrow" data-i18n="classResult"></span><h2 data-i18n="leaderboard"></h2><p class="small" data-i18n="rule"></p><ol id="ranking"></ol></aside></div></section>
<div id="notice" role="alert" hidden></div><button id="reconnect" class="secondary" hidden data-i18n="reconnect"></button></main>
<dialog id="qrDialog"><div class="flex"><h2 data-i18n="qrTitle"></h2><button id="closeQr" class="secondary" data-i18n="close"></button></div><div id="qrLarge"></div><strong id="largeCode"></strong><p data-i18n="qrHint"></p></dialog>
<dialog id="resultDialog"><div class="flex"><h2 id="resultName"></h2><button id="closeResults" class="secondary" data-i18n="close"></button></div><div id="resultAnswers"></div></dialog>
<footer><b>✳ НОБАЙ LAB</b><span data-i18n="footer"></span></footer></body></html>
